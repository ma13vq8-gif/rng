<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNG Packs - Hyper-Neon Sandbox Edition</title>
    <style>
        body {
            background-color: #1a1d29;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
            overflow-x: hidden;
        }

        /* --- ECONOMY METRICS BAR --- */
        .wallet-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .wallet-bar {
            background: #252b3d;
            border: 3px solid #00f3ff;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.2rem;
            color: #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .wallet-bar.worth {
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
        }

        h1 {
            font-size: 2.6rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 10px 0 25px 0;
            background: linear-gradient(45deg, #00f3ff, #ffcc00, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            font-weight: 900;
        }

        /* --- STAGE CAROUSEL --- */
        .carousel-outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #222736;
            padding: 35px;
            border-radius: 24px;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
            max-width: 520px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 35px;
        }

        .carousel-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 20px;
            margin-bottom: 25px;
        }

        .nav-btn {
            background: #2d354d;
            color: #00f3ff;
            border: 3px solid #00f3ff;
            padding: 15px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            background: #00f3ff;
            color: #1a1d29;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
        }

        .pack-frame {
            position: relative;
            width: 200px;
            height: 290px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pack-item {
            display: none;
            position: absolute;
            animation: fadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .pack-item.active {
            display: block;
        }

        .pack-item svg {
            width: 190px;
            height: 280px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .info-trigger {
            position: absolute;
            top: 5px;
            right: -5px;
            width: 32px;
            height: 32px;
            background: #2d354d;
            border: 3px solid #ff00ff;
            color: #ff00ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
        }

        .info-trigger:hover {
            background: #ff00ff;
            color: #ffffff;
            box-shadow: 0 0 15px #ff00ff;
        }

        /* --- SHOP SELECTIONS --- */
        .shop-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .buy-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .buy-btn {
            background: #2d354d;
            border: 3px solid #555;
            color: #fff;
            padding: 14px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .buy-btn:hover { transform: translateY(-2px); }
        .buy-btn:active { transform: scale(0.95); }

        .buy-btn.ready-common { border-color: #cbd5e1; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .buy-btn.ready-uncommon { border-color: #00ff66; box-shadow: 0 0 10px rgba(0,255,102,0.2); }
        .buy-btn.ready-rare { border-color: #0099ff; box-shadow: 0 0 10px rgba(0,153,255,0.2); }
        .buy-btn.ready-epic { border-color: #cc00ff; box-shadow: 0 0 10px rgba(204,0,255,0.2); }
        .buy-btn.ready-legendary { border-color: #ff9900; box-shadow: 0 0 10px rgba(255,153,0,0.2); }
        .buy-btn.ready-omega { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255,204,0,0.4); }

        .cost-tag { font-size: 0.8rem; color: #ffcc00; font-weight: bold; }

        /* --- AUTOMATION SLIDER --- */
        .auto-toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            border: 2px solid rgba(0, 243, 255, 0.2);
        }

        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #424b66; transition: .3s; border-radius: 24px; border: 2px solid #5a668a;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #00f3ff; border-color: #00f3ff; }
        input:checked + .slider:before { transform: translateX(24px); background-color: #1a1d29; }
        .auto-label { font-size: 0.95rem; font-weight: 900; color: #00f3ff; letter-spacing: 1.5px; }

        /* --- THE INVENTORY VAULT SYSTEM --- */
        .inventory-wrapper {
            background: #222736;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.15);
            border-radius: 24px;
            max-width: 900px;
            width: 100%;
            padding: 25px;
            box-sizing: border-box;
        }

        .inventory-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ff00ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px rgba(255,0,255,0.3);
            border-bottom: 2px solid rgba(255,0,255,0.2);
            padding-bottom: 10px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .inv-card {
            background: #1a1d29;
            border: 3px solid #fff;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .inv-card .card-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff00ff;
            color: #fff;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            box-shadow: 0 0 10px #ff00ff;
        }

        .inv-card .art-box {
            width: 100%;
            height: 90px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .inv-card .art-box svg { width: 65px; height: 65px; }
        .inv-card .item-label { font-weight: 900; font-size: 0.95rem; margin-bottom: 4px; text-align: center; }
        .inv-card .value-label { font-size: 0.8rem; color: #ffcc00; font-weight: bold; margin-bottom: 12px; }

        /* Multi Sell Controls Layout */
        .sell-tray {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: auto;
        }

        .sell-input-row {
            display: flex;
            width: 100%;
            gap: 5px;
        }

        .sell-count-input {
            width: 100%;
            background: #252b3d;
            border: 2px solid #ffaa00;
            color: #fff;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .sell-btn {
            width: 100%;
            background: #ffaa00;
            color: #1a1d29;
            border: none;
            padding: 8px 0;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: background 0.1s;
        }
        .sell-btn:hover { background: #ffcc00; }

        /* --- VISUAL SKINS --- */
        .card-common { background: linear-gradient(135deg, #4b5266, #2d3240); border-color: #cbd5e1; color: #fff; }
        .card-uncommon { background: linear-gradient(135deg, #1b4d2c, #0d2616); border-color: #00ff66; color: #00ff66; text-shadow: 0 0 5px rgba(0,255,102,0.4); }
        .card-rare { background: linear-gradient(135deg, #104473, #08223a); border-color: #0099ff; color: #0099ff; text-shadow: 0 0 5px rgba(0,153,255,0.4); }
        .card-epic { background: linear-gradient(135deg, #56146b, #2b0a36); border-color: #cc00ff; color: #e566ff; text-shadow: 0 0 5px rgba(204,0,255,0.4); }
        .card-legendary { background: linear-gradient(135deg, #73490a, #3a2505); border-color: #ff9900; color: #ffaa22; text-shadow: 0 0 5px rgba(255,153,0,0.4); }
        .card-omega { background: linear-gradient(135deg, #8a4f00, #3d2300); border-color: #ffcc00; color: #fffb00; text-shadow: 0 0 8px #ff6600; box-shadow: inset 0 0 10px rgba(255,234,0,0.3); }

        /* --- OVERLAYS & MODALS --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vw; height: 100vh;
            background: rgba(21, 24, 36, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.active { opacity: 1; pointer-events: auto; }

        .rates-card { background: #252b3d; border: 3px solid #ff00ff; border-radius: 16px; padding: 25px; width: 320px; box-shadow: 0 0 35px #ff00ff; }
        .rates-header { font-weight: 900; text-transform: uppercase; color: #ff00ff; margin-bottom: 18px; text-align: center; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; letter-spacing: 1.5px; }
        .rate-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }

        .card-stage { perspective: 1000px; width: 220px; height: 330px; margin-bottom: 25px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; }
        .card-back { background: linear-gradient(135deg, #2d354d 0%, #1a1d29 100%); border: 4px solid #00f3ff; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px #00f3ff; }
        .card-back-pattern { width: 85%; height: 85%; border: 3px dashed rgba(0, 243, 255, 0.5); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #00f3ff; font-weight: 900; font-size: 1.4rem; letter-spacing: 2px; }
        .card-front { transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: space-between; padding: 18px; box-sizing: border-box; border: 4px solid #fff; }
        .card-front .tier-name { font-weight: 900; font-size: 1.2rem; text-transform: uppercase; }
        .card-front .item-art { flex-grow: 1; margin: 15px 0; background: rgba(0, 0, 0, 0.3); border-radius: 12px; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .card-front .item-art svg { width: 100%; height: 100%; max-height: 140px; }
        
        #autoNotice { color: #00f3ff; font-size: 0.95rem; margin-top: 10px; height: 18px; font-weight: bold; }

        .btn-ui { background: #ff0055; color: #fff; border: none; padding: 14px 32px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; box-shadow: 0 0 20px #ff0055; }
        .btn-ui.purple { background: #bf00ff; box-shadow: 0 0 20px #bf00ff; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="wallet-container">
        <!-- BALANCES CONTAINER -->
        <div class="wallet-bar">
            <span>⚡ COINS:</span>
            <span id="coinDisplay">∞ INFINITE</span>
        </div>
        <div class="wallet-bar worth">
            <span>💎 VAULT VALUE:</span>
            <span id="valueDisplay">0 COINS</span>
        </div>
    </div>

    <h1>Packs Simulator</h1>
    
    <div class="carousel-outer">
        <div class="carousel-main">
            <button class="nav-btn" onclick="changePack(-1)">◀</button>
            
            <div class="pack-frame">
                <div class="info-trigger" onclick="openRatesModal()">?</div>

                <!-- PACK: COMMON -->
                <div class="pack-item active" data-tier="common">
                    <svg viewBox="0 0 160 250">
                        <defs><linearGradient id="cG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5a6378"/><stop offset="100%" stop-color="#242933"/></linearGradient></defs>
                        <path d="M 10 0 Q 15 5 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 T 140 0 T 150 0 L 150 250 Q 145 245 140 250 T 120 250 T 100 250 T 80 250 T 60 250 T 40 250 T 20 250 T 10 250 Z" fill="#717d96" stroke="#fff" stroke-width="2"/>
                        <rect x="10" y="15" width="140" height="220" fill="url(#cG)"/>
                        <rect x="25" y="100" width="110" height="40" rx="5" fill="#1a1d29" stroke="#cbd5e1" stroke-width="3"/>
                        <text x="80" y="125" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">COMMON</text>
                    </svg>
                </div>

                <!-- PACK: UNCOMMON -->
                <div class="pack-item" data-tier="uncommon">
                    <svg viewBox="0 0 160 250">
                        <defs><linearGradient id="uG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1ea649"/><stop offset="100%" stop-color="#0b3d1b"/></linearGradient></defs>
                        <path d="M 10 0 Q 15 5 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 T 140 0 T 150 0 L 150 250 Q 145 245 140 250 T 120 250 T 100 250 T 80 250 T 60 250 T 40 250 T 20 250 T 10 250 Z" fill="#00ff66" stroke="#00ff66" stroke-width="2"/>
                        <rect x="10" y="15" width="140" height="220" fill="url(#uG)"/>
                        <rect x="25" y="100" width="110" height="40" rx="5" fill="#1a1d29" stroke="#00ff66" stroke-width="3"/>
                        <text x="80" y="125" font-size="12" font-weight="900" fill="#00ff66" text-anchor="middle">UNCOMMON</text>
                    </svg>
                </div>

                <!-- PACK: RARE -->
                <div class="pack-item" data-tier="rare">
                    <svg viewBox="0 0 160 250">
                        <defs><linearGradient id="rG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00beff"/><stop offset="100%" stop-color="#043254"/></linearGradient></defs>
                        <path d="M 10 0 Q 15 5 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 T 140 0 T 150 0 L 150 250 Q 145 245 140 250 T 120 250 T 100 250 T 80 250 T 60 250 T 40 250 T 20 250 T 10 250 Z" fill="#0099ff" stroke="#0099ff" stroke-width="2"/>
                        <rect x="10" y="15" width="140" height="220" fill="url(#rG)"/>
                        <rect x="25" y="100" width="110" height="40" rx="5" fill="#1a1d29" stroke="#0099ff" stroke-width="3"/>
                        <text x="80" y="125" font-size="13" font-weight="900" fill="#0099ff" text-anchor="middle">RARE</text>
                    </svg>
                </div>

                <!-- PACK: EPIC -->
                <div class="pack-item" data-tier="epic">
                    <svg viewBox="0 0 160 250">
                        <defs><linearGradient id="eG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a600ff"/><stop offset="100%" stop-color="#3c005c"/></linearGradient></defs>
                        <path d="M 10 0 Q 15 5 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 T 140 0 T 150 0 L 150 250 Q 145 245 140 250 T 120 250 T 100 250 T 80 250 T 60 250 T 40 250 T 20 250 T 10 250 Z" fill="#cc00ff" stroke="#cc00ff" stroke-width="2"/>
                        <rect x="10" y="15" width="140" height="220" fill="url(#eG)"/>
                        <rect x="25" y="100" width="110" height="40" rx="5" fill="#1a1d29" stroke="#cc00ff" stroke-width="3"/>
                        <text x="80" y="125" font-size="13" font-weight="900" fill="#cc00ff" text-anchor="middle">EPIC</text>
                    </svg>
                </div>

                <!-- PACK: LEGENDARY -->
                <div class="pack-item" data-tier="legendary">
                    <svg viewBox="0 0 160 250">
                        <defs><linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff9900"/><stop offset="100%" stop-color="#5c3700"/></linearGradient></defs>
                        <path d="M 10 0 Q 15 5 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 T 140 0 T 150 0 L 150 250 Q 145 245 140 250 T 120 250 T 100 250 T 80 250 T 60 250 T 40 250 T 20 250 T 10 250 Z" fill="#ff9900" stroke="#ff9900" stroke-width="2"/>
                        <rect x="10" y="15" width="140" height="220" fill="url(#lG)"/>
                        <rect x="25" y="100" width="110" height="40" rx="5" fill="#1a1d29" stroke="#ff9900" stroke-width="3"/>
                        <text x="80" y="125" font-size="12" font-weight="900" fill="#ff9900" text-anchor="middle">LEGENDARY</text>
                    </svg>
                </div>

                <!-- PACK: OMEGA -->
                <div class="pack-item" data-tier="omega">
                    <svg viewBox="0 0 160 250">
                        <defs><linearGradient id="oG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffea00"/><stop offset="50%" stop-color="#ff7700"/><stop offset="100%" stop-color="#2b1100"/></linearGradient></defs>
                        <path d="M 10 0 Q 15 5 20 0 T 40 0 T 60 0 T 80 0 T 100 0 T 120 0 T 140 0 T 150 0 L 150 250 Q 145 245 140 250 T 120 250 T 100 250 T 80 250 T 60 250 T 40 250 T 20 250 T 10 250 Z" fill="#ffaa00" stroke="#ffea00" stroke-width="3"/>
                        <rect x="10" y="15" width="140" height="220" fill="url(#oG)"/>
                        <rect x="25" y="100" width="110" height="40" rx="5" fill="#1a1d29" stroke="#ffea00" stroke-width="3"/>
                        <text x="80" y="125" font-size="13" font-weight="900" fill="#ffea00" text-anchor="middle">OMEGA</text>
                    </svg>
                </div>
            </div>

            <button class="nav-btn" onclick="changePack(1)">▶</button>
        </div>

        <div class="shop-controls">
            <div class="buy-group">
                <button id="btnBuy1" class="buy-btn" onclick="purchasePack(1)">
                    <span>Buy x1</span><span class="cost-tag">FREE</span>
                </button>
                <button id="btnBuy3" class="buy-btn" onclick="purchasePack(3)">
                    <span>Buy x3</span><span class="cost-tag">FREE</span>
                </button>
                <button id="btnBuy8" class="buy-btn" onclick="purchasePack(8)">
                    <span>Buy x8</span><span class="cost-tag">FREE</span>
                </button>
            </div>

            <div class="auto-toggle-container">
                <span class="auto-label">AUTO OPEN PACKS</span>
                <label class="switch">
                    <input type="checkbox" id="autoOpenCheck" onchange="toggleAutoOpen()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- --- INVENTORY BLOCK --- -->
    <div class="inventory-wrapper">
        <h2 class="inventory-title">Storage Vault</h2>
        <div id="inventoryGrid" class="inventory-grid">
            <!-- Cards appended here inside script -->
        </div>
    </div>

    <!-- MODALS SECTION -->
    <div id="ratesModal" class="modal" onclick="closeRatesModal()">
        <div class="rates-card" onclick="event.stopPropagation()">
            <div id="modalTitle" class="rates-header">Drop Pool Info</div>
            <div id="modalRatesContent"></div>
            <button class="btn-ui purple" style="width:100%" onclick="closeRatesModal()">CLOSE</button>
        </div>
    </div>

    <div id="openingScreen" class="modal">
        <h2 style="margin-bottom: 5px;">PACK OPENED</h2>
        <div style="font-size: 0.95rem; margin-bottom: 20px; color: #a2b2c9; font-weight:bold;" id="queueNotice">Remaining: 0</div>
        
        <div class="card-stage">
            <div id="cardInner" class="card-inner" onclick="flipCard()">
                <div class="card-back"><div class="card-back-pattern">REVEAL</div></div>
                <div id="cardFront" class="card-front">
                    <div id="cardTier" class="tier-name">-</div>
                    <div id="cardIcon" class="item-art"></div>
                    <div style="font-size: 0.75rem; font-weight:bold; opacity:0.8;" id="cardValText">VALUE: 0</div>
                </div>
            </div>
        </div>
        <div id="autoNotice"></div>
        <button id="closeBtn" class="btn-ui" style="display:none;" onclick="closeOpeningScreen()">NEXT</button>
    </div>

    <script>
        let currentPackIndex = 0;
        let unbookedDropQueue = [];
        let isAutoOpenRunning = false;
        let autoLoopTimer = null;

        // Structured storage array keeping counts of item drops
        let userInventory = {}; 

        const packs = document.querySelectorAll('.pack-item');

        const vectors = {
            stick: `<svg viewBox="0 0 64 64"><path d="M12 52L52 12M8 56l6-6M48 16l8-8" stroke="#cca473" stroke-width="8" stroke-linecap="round"/></svg>`,

            scythe: `<svg viewBox="0 0 64 64"><path d="M20 56L44 12" stroke="#475569" stroke-width="4"/><path d="M44 12Q20 8 10 20q16 0 34-8z" fill="#cbd5e1" stroke="#cc00ff" stroke-width="2"/></svg>`,
            egg: `<svg viewBox="0 0 64 64"><path d="M32 10C20 10 14 28 14 42c0 10 8 14 18 14s18-4 18-14z" fill="#ea580c" stroke="#ff9900" stroke-width="3"/></svg>`,
            core: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="10" fill="#fff"/><circle cx="32" cy="32" r="22" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="6 4"/></svg>`,
            excalibur: `<svg viewBox="0 0 64 64"><path d="M20 44L48 16" stroke="#fff" stroke-width="4"/><path d="M44 12l8 8-4 4-8-8z" fill="#ff9900"/></svg>`,
            crown: `<svg viewBox="0 0 64 64"><path d="M10 46l6-24 16 14 16-14 6 24Z" fill="#eab308" stroke="#ff9900" stroke-width="3"/></svg>`,
            key: `<svg viewBox="0 0 64 64"><circle cx="22" cy="26" r="10" fill="none" stroke="#ffcc00" stroke-width="4"/><path d="M32 26h22v10h-4v-6z" fill="#ffcc00"/></svg>`,
            cube: `<svg viewBox="0 0 64 64"><path d="M32 8L10 20v24l22 12l22-12V20Z" fill="none" stroke="#ffcc00" stroke-width="4"/><path d="M10 20l22 12l22-12" stroke="#ff9900" stroke-width="2"/></svg>`,
            time: `<svg viewBox="0 0 64 64"><path d="M16 14h32L18 50h28z" fill="none" stroke="#ff7700" stroke-width="4"/></svg>`,
            singularity: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="#000" stroke="#ffcc00" stroke-width="4"/><circle cx="32" cy="32" r="26" fill="none" stroke="#ff5500" stroke-width="2" stroke-dasharray="8 4"/></svg>`
        };

        const tierConfig = {
            common: {
                name: 'Common', class: 'ready-common',
                lootTable: [
                    { id: 'wood_stick', name: 'Wooden Stick', rate: 50, vector: vectors.stick, rarity: 'card-common', value: 15 },
                    { id: 'rusty_nail', name: 'Rusty Nail',  rate: 35, vector: vectors.nail, rarity: 'card-common', value: 25 },
                    { id: 'iron_ring',  name: 'Iron Ring',   rate: 14, vector: vectors.ring, rarity: 'card-rare', value: 120 },
                    { id: 'shiny_gem',  name: 'Shiny Gem',   rate: 1,  vector: vectors.gem, rarity: 'card-legendary', value: 850 }
                ]
            },
            uncommon: {
                name: 'Uncommon', class: 'ready-uncommon',
                lootTable: [
                    { id: 'iron_dagger', name: 'Iron Dagger',  rate: 45, vector: vectors.dagger, rarity: 'card-uncommon', value: 60 },
                    { id: 'leather_boot', name: 'Leather Boot', rate: 35, vector: vectors.boot, rarity: 'card-uncommon', value: 75 },
                    { id: 'spike_shield', name: 'Spike Shield', rate: 18, vector: vectors.shield, rarity: 'card-rare', value: 200 },
                    { id: 'void_essence', name: 'Void Essence', rate: 2,  vector: vectors.void, rarity: 'card-epic', value: 1500 }
                ]
            },
            rare: {
                name: 'Rare', class: 'ready-rare',
                lootTable: [
                    { id: 'mana_wand',    name: 'Mana Wand',    rate: 50, vector: vectors.wand, rarity: 'card-rare', value: 180 },
                    { id: 'steel_armor',  name: 'Steel Armor',  rate: 30, vector: vectors.armor, rarity: 'card-rare', value: 250 },
                    { id: 'phoenix_down', name: 'Phoenix Down', rate: 17, vector: vectors.epic, rarity: 'card-epic', value: 1100 },
                    { id: 'cosmic_shard', name: 'Cosmic Shard', rate: 3,  vector: vectors.shard, rarity: 'card-omega', value: 5000 }
                ]
            },
            epic: {
                name: 'Epic', class: 'ready-epic',
                lootTable: [
                    { id: 'shadow_cloak', name: 'Shadow Cloak', rate: 50, vector: vectors.cloak, rarity: 'card-epic', value: 800 },
                    { id: 'reaper_scythe',name: 'Reaper Scythe',rate: 35, vector: vectors.scythe, rarity: 'card-epic', value: 1250 },
                    { id: 'dragon_egg',   name: 'Dragon Egg',   rate: 12, vector: vectors.egg, rarity: 'card-legendary', value: 4500 },
                    { id: 'god_core',     name: 'God Core',      rate: 3,  vector: vectors.core, rarity: 'card-omega', value: 12000 }
                ]
            },
            legendary: {
                name: 'Legendary', class: 'ready-legendary',
                lootTable: [
                    { id: 'excalibur',    name: 'Excalibur',    rate: 55, vector: vectors.excalibur, rarity: 'card-legendary', value: 6500 },
                    { id: 'holy_crown',   name: 'Holy Crown',   rate: 35, vector: vectors.crown, rarity: 'card-legendary', value: 9000 },
                    { id: 'chrono_key',   name: 'Chrono Key',   rate: 10, vector: vectors.key, rarity: 'card-omega', value: 25000 }
                ]
            },
            omega: {
                name: 'Omega', class: 'ready-omega',
                lootTable: [
                    { id: 'infinity_cube',name: 'Infinity Cube',rate: 60, vector: vectors.cube, rarity: 'card-omega', value: 40000 },
                    { id: 'time_alterer', name: 'Time Alterer', rate: 35, vector: vectors.time, rarity: 'card-omega', value: 75000 },
                    { id: 'singularity',  name: 'Singularity',  rate: 5,  vector: vectors.singularity, rarity: 'card-omega', value: 250000 }
                ]
            }
        };

        function getActiveTierKey() {
            return packs[currentPackIndex].getAttribute('data-tier');
        }

        function updatePriceButtons() {
            const currentData = tierConfig[getActiveTierKey()];
            document.getElementById('btnBuy1').className = `buy-btn ${currentData.class}`;
            document.getElementById('btnBuy3').className = `buy-btn ${currentData.class}`;
            document.getElementById('btnBuy8').className = `buy-btn ${currentData.class}`;
        }

        function changePack(direction) {
            packs[currentPackIndex].classList.remove('active');
            currentPackIndex += direction;
            if (currentPackIndex >= packs.length) currentPackIndex = 0;
            if (currentPackIndex < 0) currentPackIndex = packs.length - 1;
            packs[currentPackIndex].classList.add('active');
            updatePriceButtons();
        }

        function openRatesModal() {
            const tierKey = getActiveTierKey();
            const config = tierConfig[tierKey];
            document.getElementById('modalTitle').innerText = `${config.name} Pack Contents`;
            
            let htmlBuffer = "";
            config.lootTable.forEach(item => {
                htmlBuffer += `
                    <div class="rate-row">
                        <span style="display:flex; align-items:center; gap:10px; width:35px; height:35px;">${item.vector}</span>
                        <span style="flex-grow:1; margin-left:12px; font-weight:bold;">${item.name}</span>
                        <span style="font-weight:900; color:#ffcc00; font-size:0.85rem; margin-right:15px;">$${item.value}</span>
                        <span style="font-weight:900; color:#00f3ff;">${item.rate}%</span>
                    </div>
                `;
            });
            document.getElementById('modalRatesContent').innerHTML = htmlBuffer;
            document.getElementById('ratesModal').classList.add('active');
        }

        function closeRatesModal() {
            document.getElementById('ratesModal').classList.remove('active');
        }

        function purchasePack(quantity) {
            const tierKey = getActiveTierKey();
            const config = tierConfig[tierKey];

            for (let i = 0; i < quantity; i++) {
                unbookedDropQueue.push(rollDropItem(config.lootTable));
            }

            if (!document.getElementById('openingScreen').classList.contains('active')) {
                processNextQueueItem();
            }
        }

        function rollDropItem(lootTable) {
            const rand = Math.random() * 100;
            let currentSum = 0;
            for (let i = 0; i < lootTable.length; i++) {
                currentSum += lootTable[i].rate;
                if (rand <= currentSum) return lootTable[i];
            }
            return lootTable[lootTable.length - 1];
        }

        function processNextQueueItem() {
            if (unbookedDropQueue.length === 0) {
                closeOpeningScreen();
                return;
            }

            const item = unbookedDropQueue.shift();
            document.getElementById('queueNotice').innerText = `Remaining in current pull: ${unbookedDropQueue.length}`;
            
            // Add to persistent vault tracker logic immediately upon pull
            if (!userInventory[item.id]) {
                userInventory[item.id] = { meta: item, count: 0 };
            }
            userInventory[item.id].count += 1;
            recalculateInventoryView();

            const cardFront = document.getElementById('cardFront');
            cardFront.className = `card-front ${item.rarity}`;
            document.getElementById('cardTier').innerText = item.name;
            document.getElementById('cardIcon').innerHTML = item.vector;
            document.getElementById('cardValText').innerText = `VALUE: ${item.value} COINS`;

            document.getElementById('cardInner').classList.remove('flipped');
            document.getElementById('closeBtn').style.display = 'none';
            document.getElementById('openingScreen').classList.add('active');

            if (isAutoOpenRunning) {
                document.getElementById('autoNotice').innerText = "AUTO GENERATING PACK CARDS...";
                autoLoopTimer = setTimeout(() => {
                    document.getElementById('cardInner').classList.add('flipped');
                    autoLoopTimer = setTimeout(processNextQueueItem, 800);
                }, 250);
            } else {
                document.getElementById('autoNotice').innerText = "";
                document.getElementById('closeBtn').style.display = 'inline-block';
            }
        }

        // Vault calculations view engine processing logic loops
        function recalculateInventoryView() {
            const gridContainer = document.getElementById('inventoryGrid');
            gridContainer.innerHTML = "";
            let comprehensiveNetWorth = 0;

            Object.keys(userInventory).forEach(key => {
                const stack = userInventory[key];
                if (stack.count <= 0) return;

                comprehensiveNetWorth += (stack.meta.value * stack.count);

                const cardNode = document.createElement('div');
                cardNode.className = `inv-card ${stack.meta.rarity}`;
                
                cardNode.innerHTML = `
                    <div class="card-badge">x${stack.count}</div>
                    <div class="art-box">${stack.meta.vector}</div>
                    <div class="item-label">${stack.meta.name}</div>
                    <div class="value-label">Val: ${stack.meta.value} Coins</div>
                    <div class="sell-tray">
                        <div class="sell-input-row">
                            <input type="number" class="sell-count-input" id="amt-${key}" min="1" max="${stack.count}" value="1">
                        </div>
                        <button class="sell-btn" onclick="sellCardStack('${key}')">Sell Selected</button>
                    </div>
                `;
                gridContainer.appendChild(cardNode);
            });

            document.getElementById('valueDisplay').innerText = `${comprehensiveNetWorth.toLocaleString()} COINS`;
        }

        function sellCardStack(itemId) {
            const inputField = document.getElementById(`amt-${itemId}`);
            let burnAmount = parseInt(inputField.value);
            const targetStack = userInventory[itemId];

            if (isNaN(burnAmount) || burnAmount < 1) burnAmount = 1;
            if (burnAmount > targetStack.count) burnAmount = targetStack.count;

            // Update item asset stack bounds
            targetStack.count -= burnAmount;
            
            // Coins remain INFINITE as requested, but we instantly clear and rebuild counts
            recalculateInventoryView();
        }

        function flipCard() {
            if (!isAutoOpenRunning) {
                document.getElementById('cardInner').classList.add('flipped');
            }
        }

        function closeOpeningScreen() {
            clearTimeout(autoLoopTimer);
            document.getElementById('openingScreen').classList.remove('active');
            document.getElementById('cardInner').classList.remove('flipped');
            
            if(unbookedDropQueue.length > 0) {
                setTimeout(processNextQueueItem, 200);
            } else if (isAutoOpenRunning) {
                setTimeout(() => { if(isAutoOpenRunning) purchasePack(1); }, 150);
            }
        }

        function toggleAutoOpen() {
            isAutoOpenRunning = document.getElementById('autoOpenCheck').checked;
            if (isAutoOpenRunning && !document.getElementById('openingScreen').classList.contains('active')) {
                purchasePack(1);
            }
        }

        updatePriceButtons();
    </script>
